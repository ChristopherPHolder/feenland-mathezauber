<div class="sky">
  <span class="moon"></span>
  <svg class="town" viewBox="0 0 400 40" preserveAspectRatio="none">
    <path
      d="M0 40V30h18V22l8-8 8 8v8h14V18h12v12h10V26l10-10 10 10v4h16V12l6-8 6 8v18h12V24h20v6h10V16l9-9 9 9v14h14V22h16v8h12V20l10-8 10 8v10h20V26h14v4h18V18l8-6 8 6v12h12V24h16v6h20v10z"
    />
    <g class="windows">
      <rect x="22" y="24" width="3" height="4" />
      <rect x="52" y="22" width="3" height="4" />
      <rect x="86" y="22" width="3" height="4" />
      <rect x="117" y="16" width="3" height="4" />
      <rect x="172" y="20" width="3" height="4" />
      <rect x="206" y="24" width="3" height="4" />
      <rect x="252" y="24" width="3" height="4" />
      <rect x="290" y="24" width="3" height="4" />
      <rect x="344" y="22" width="3" height="4" />
      <rect x="370" y="26" width="3" height="4" />
    </g>
  </svg>
  <svg class="lanterns" viewBox="0 0 400 30" preserveAspectRatio="none">
    <path class="string" d="M0 6Q100 26 200 8T400 6" />
    @for (x of [30, 80, 130, 180, 230, 280, 330, 380]; track x; let i = $index) {
      <circle
        [attr.cx]="x"
        [attr.cy]="x < 200 ? 13 + (i % 2) * 2 : 12"
        r="4"
        [attr.fill]="hues[i % hues.length]"
      />
    }
  </svg>
</div>
<div class="lake">
  <span class="reflection"></span>
</div>

<div class="burst-area">
  @if (frame().phase === 'show') {
    @for (burst of showBursts(); track $index) {
      <svg
        class="show-burst"
        viewBox="-2 -2 4 4"
        [style.left.%]="burst.x"
        [style.top.%]="burst.y"
        [style.--delay]="burst.delay"
        [style.--color]="burst.color"
      >
        @for (spoke of [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]; track spoke) {
          <circle r="0.16" [attr.transform]="'rotate(' + spoke + ') translate(1.2 0)'" />
        }
      </svg>
    }
    <svg class="show-shape" viewBox="0 0 100 100">
      <path [attr.d]="shapePath()" />
    </svg>
  } @else {
    @for (key of burstKey(); track key) {
      <svg class="burst" [attr.viewBox]="viewBox()" preserveAspectRatio="xMidYMid meet">
        @for (box of frame().pattern.frames; track $index) {
          <rect
            class="frame"
            [attr.x]="-box.w / 2"
            [attr.y]="-box.h / 2"
            [attr.width]="box.w"
            [attr.height]="box.h"
            rx="0.35"
            [attr.transform]="boxTransform(box)"
          />
        }
        @for (point of frame().pattern.empty; track $index) {
          <circle class="empty" r="0.26" [attr.transform]="at(point)" />
        }
        <g class="sparks">
          @for (spark of frame().pattern.sparks; track $index) {
            @if (shapeOf(frame().pattern, spark.burst) === 'star') {
              <path class="spark star" [attr.d]="star" [attr.transform]="at(spark)" />
            } @else {
              <circle class="spark round" r="0.3" [attr.transform]="at(spark)" />
            }
          }
        </g>
        @if (frame().outlines) {
          @for (box of frame().pattern.groups; track $index) {
            <rect
              class="group"
              [style.--i]="$index"
              [attr.x]="-box.w / 2"
              [attr.y]="-box.h / 2"
              [attr.width]="box.w"
              [attr.height]="box.h"
              rx="0.4"
              [attr.transform]="boxTransform(box)"
            />
          }
        }
      </svg>
    }
  }
  @if (frame().phase === 'launch') {
    <span class="rocket"></span>
  }
</div>

<svg class="crowd" viewBox="0 0 400 60" preserveAspectRatio="xMidYMax slice">
  <path
    d="M0 60V44c6-10 14-10 18 0 2-12 16-14 20-2 4-8 12-8 14 2 4-14 18-14 22 0 2-8 10-8 12 0 6-12 18-12 22 2 2-8 12-10 16 0 6-14 20-14 24 0 2-6 10-6 12 2 4-12 18-12 22 0 4-10 14-10 16 2 6-14 20-12 22 2 2-8 10-8 14 0 4-12 16-12 20 0 4-8 12-8 14 2 6-12 18-12 22 0 2-6 10-6 12 0 6-14 18-12 22 2 4-10 14-10 16 0V60z"
  />
  <g class="ears">
    <path
      d="M24 34l3-8 3 8zM70 32l3-9 3 9zM138 34l3-8 3 8zM212 30l3-9 3 9zM288 32l3-8 3 8zM352 34l3-9 3 9z"
    />
  </g>
</svg>
<div class="jetty">
  <span class="planks"></span>
  <app-flick class="flick" [pose]="pose()" />
</div>
