<h2 #heading tabindex="-1">{{ t('freeTrip') }}</h2>
<p class="wallet">{{ t('purseTag', { amount: money(budget) }) }}</p>
<fieldset>
  <legend>{{ t('chooseGoods') }}</legend>
  <div class="goods">
    @for (item of goods; track item.good) {
      <label [for]="'basket-' + item.good">
        <input
          [id]="'basket-' + item.good"
          type="checkbox"
          [checked]="selected().includes(item.good)"
          (change)="toggle(item.good)"
        />
        <span class="art" aria-hidden="true">{{ emoji[item.good] }}</span>
        <span>{{ name(item.good) }}</span
        ><strong>{{ money(item.price) }}</strong>
      </label>
    }
  </div>
</fieldset>
<p role="status">{{ total() > budget ? t('overBudget') : '' }}</p>
<button
  class="button primary"
  type="button"
  [disabled]="!items().length || total() > budget"
  (click)="checkout.emit(items())"
>
  {{ t('checkout') }}
</button>
<button class="button secondary" type="button" (click)="leave.emit()">{{ t('backLevels') }}</button>
