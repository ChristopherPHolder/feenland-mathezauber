<fieldset
  class="spell-bar"
  [class.expanded]="spells().length > 5"
  [disabled]="locked()"
  [attr.aria-busy]="locked()"
>
  <legend class="sr-only">{{ t('choose') }}</legend>
  @for (spell of spells(); track $index; let index = $index) {
    <button
      #primarySpell
      class="spell"
      [class.zero]="spell === 0"
      [class.selected]="selected() === spell && locked()"
      [attr.aria-label]="t('spell', { n: spell })"
      (click)="castSpell.emit(spell)"
    >
      <span class="gem-art" aria-hidden="true"
        ><img
          ngSrc="/images/fairy-defense/crystals.webp"
          width="2172"
          height="724"
          [style.transform]="'translateX(' + -((spell === 0 ? 0 : spell - 1) % 5) * 20 + '%)'"
          alt=""
      /></span>
      <span class="spell-number">{{ i.format(spell) }}</span>
      <span class="spell-quantity" aria-hidden="true">
        @for (dot of quantities.slice(0, spell); track dot) {
          <span></span>
        }
      </span>
    </button>
  }
</fieldset>
