name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Deployments queue one after another; a pull request's newer push replaces its older run.
  group: ${{ github.event_name == 'push' && 'cloudflare-production' || format('checks-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: ${{ github.event_name == 'push' && 'Test and deploy' || 'Test and build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Check formatting, lint and types
        run: vp check --deny-warnings

      - name: Run tests
        run: vp test

      - name: Build
        if: github.event_name == 'pull_request'
        run: vp build

      - name: Build and deploy to Cloudflare Workers
        if: github.event_name == 'push'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret to enable deployment."
            exit 1
          fi
          npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
