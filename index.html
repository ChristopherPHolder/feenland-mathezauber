<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Feenland Mathezauber</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Explore a magical world of numbers with Feenland Mathezauber."
    />
    <meta name="theme-color" content="#edf7fb" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Feenland" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // A saved calm-motion choice stills the splash before any app script runs.
      try {
        if (localStorage.getItem('feenland.calm-motion') === 'true')
          document.documentElement.classList.add('calm-motion');
      } catch {}
    </script>
    <style>
      /* The loading splash paints with this file, before the app's scripts arrive, and covers
         the screen until the first page is ready (core/boot-splash removes it). Its colours are
         literal because the design tokens may not have loaded yet. The logo and bar wait a
         moment before appearing, so a fast start shows no flash. */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 28px;
        background: #edf7fb;
      }
      .boot-splash img {
        width: 96px;
        height: 96px;
        border-radius: 28px;
        box-shadow: 0 10px 28px #17255526;
        animation:
          boot-pop 420ms cubic-bezier(0.2, 0.8, 0.2, 1) 150ms both,
          boot-float 1.8s ease-in-out 570ms infinite alternate;
      }
      .boot-splash progress {
        width: 128px;
        height: 8px;
        border: 0;
        border-radius: 999px;
        appearance: none;
        background: #d3e5ee linear-gradient(90deg, #c91860, #f5c55b) no-repeat;
        background-size: 40% 100%;
        animation:
          boot-pop 420ms ease-out 250ms both,
          boot-sweep 1.1s ease-in-out 250ms infinite alternate;
      }
      .boot-splash progress::-webkit-progress-bar,
      .boot-splash progress::-webkit-progress-value {
        background: none;
      }
      .boot-splash progress::-moz-progress-bar {
        background: none;
      }
      @keyframes boot-pop {
        from {
          opacity: 0;
          scale: 0.85;
        }
      }
      @keyframes boot-float {
        to {
          translate: 0 -8px;
        }
      }
      @keyframes boot-sweep {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 100% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash * {
          animation: none !important;
          background-position: 50% 0 !important;
        }
      }
      .calm-motion .boot-splash * {
        animation: none !important;
        background-position: 50% 0 !important;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <div id="boot-splash" class="boot-splash" role="main">
      <img src="logo.svg" width="96" height="96" alt="" />
      <progress aria-label="Feenland Mathezauber"></progress>
    </div>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
